buildscript {
    repositories {
        jcenter()
        maven { url = "https://files.minecraftforge.net/maven" }
        maven { url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

version = "1.0.4-Beta"
group = "com.yuki920.betterchatmod"
archivesBaseName = "betterchatmod"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    
    makeObfSourceJar = false
}

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
}

dependencies {
    // providedを使用してコンパイル時のみ使用、jarには含めない
    compile('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
}

mixin {
    add sourceSets.main, "mixins.betterchatmod.refmap.json"
}

jar {
    // Mixinライブラリを除外
    exclude 'org/spongepowered/**'
    
    manifest.attributes(
        "FMLCorePluginContainsFMLMod": "true",
        "ForceLoadAsMod": "true",
        "MixinConfigs": "mixins.betterchatmod.json"
    )
}

// reobfタスクを無効化
afterEvaluate {
    reobfJar.enabled = false
}

build.dependsOn.remove('reobfJar')